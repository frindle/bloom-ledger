<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom ledger</title>
<style>
  :root {
    --paper: #e9efec; --card: #f6f9f7; --ink: #12211d; --muted: #4d625b; --rule: #a9bbb4;
    --sealed: #0e6b5b; --waiting: #b7791f; --missing: #9b2c2c; --open: #12211d;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--serif); }
  a { color: var(--ink); text-underline-offset: .2em; }
  main { max-width: 64rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 2.1rem; line-height: 1.15; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  h2 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  p { margin: 0; }
  .status { font-size: 1.15rem; max-width: 40rem; }
  .meta { color: var(--muted); font-size: .9rem; margin-top: .4rem; }
  .banner { margin: 1.25rem 0 0; padding: .7rem 1rem; border-left: 4px solid var(--missing); background: #f3dede; max-width: 40rem; }
  .banner[hidden] { display: none; }
  section { margin-top: 2.5rem; }
  .alerts ul { list-style: none; margin: .75rem 0 0; padding: 0; display: grid; gap: .5rem; max-width: 44rem; }
  .alerts li { padding: .6rem .9rem; background: var(--card); border-left: 4px solid var(--waiting); }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .25rem 1rem; margin-bottom: .35rem; }
  .top nav a { font-size: 1rem; padding: .35rem 0; display: inline-block; }
  a:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .picker { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; margin-top: .75rem; }
  .picker label { font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .picker select { font: inherit; font-size: 1.25rem; font-weight: 600; color: var(--ink); background: var(--card); border: 2px solid var(--ink);
                   border-radius: 0; padding: .3rem .6rem; min-height: 2.75rem; max-width: 100%; }
  #machine-summary { margin-top: .6rem; max-width: 46rem; }
  #machine-summary .meta { margin: .1rem 0 0; }
  .logwrap { margin-top: 1.25rem; background: var(--card); border-top: 3px double var(--ink); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  caption { text-align: left; padding: .6rem 1rem; color: var(--muted); font-size: .9rem; }
  thead th { text-align: left; font-weight: 400; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
             padding: .4rem 1rem; border-bottom: 1px solid var(--ink); }
  tbody th, tbody td { text-align: left; font-weight: 400; padding: .55rem 1rem; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
  tbody th { font-weight: 600; border-left: 6px solid var(--sealed); white-space: nowrap; }
  tr[data-state="open"] th { border-left-color: var(--muted); }
  tr[data-state="missing"] th { border-left-color: var(--missing); }
  tr[data-state="missing"] .st { color: var(--missing); font-weight: 600; }
  .st .mark { display: inline-block; width: 1.1em; }
  td.num { text-align: right; }
  .hash-toggle { font: inherit; background: none; border: 1px solid transparent; border-bottom-color: var(--ink); color: var(--ink); cursor: pointer;
                 padding: .35rem .25rem; min-height: 2.75rem; text-align: left; font-family: var(--mono); font-size: .85rem;
                 overflow-wrap: anywhere; max-width: 100%; }
  .hash-toggle:hover { background: var(--paper); }
  .none { color: var(--muted); }
  .empty { padding: 1rem; color: var(--muted); }
  .empty[hidden] { display: none; }
  @media (max-width: 40rem) {
    thead { position: absolute; left: -9999px; }
    table, tbody, tr, th, td { display: block; }
    tbody tr { padding: .6rem 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 0 .5rem; }
    tbody th, tbody td { border: 0; padding: .15rem 1rem; }
    tbody th { grid-column: 1 / -1; }
    td.num { text-align: left; }
    tbody td::before { content: attr(data-label); color: var(--muted); font-size: .8rem; display: block; }
    td.hashcell { grid-column: 1 / -1; }
    caption { display: block; width: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) { .hash-toggle { transition: background .12s; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Bloom ledger</h1>
    <nav aria-label="Pages"><a href="/settings">Settings</a></nav>
  </div>
  <p class="status" id="status" aria-live="polite">Loading the ledger…</p>
  <p class="meta" id="updated"></p>
  <div class="banner" id="banner" role="alert" hidden></div>

  <section class="alerts" aria-labelledby="alerts-h">
    <h2 id="alerts-h">Open alerts</h2>
    <ul id="alerts"></ul>
  </section>

  <section aria-labelledby="log-h">
    <h2 id="log-h">Machine log</h2>
    <div class="picker">
      <label for="machine-select">Machine</label>
      <select id="machine-select"></select>
    </div>
    <div id="machine-summary"></div>
    <div class="logwrap">
      <table>
        <caption>Days received, newest first (up to the last 90 days)</caption>
        <thead><tr><th scope="col">Date</th><th scope="col">Status</th><th scope="col">Records</th><th scope="col">Size</th><th scope="col">Chain hash</th></tr></thead>
        <tbody id="day-rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>No machine has sent records yet.</p>
    </div>
  </section>
</main>
<script>
(() => {
  "use strict";
  const REFRESH_MS = 60000, KEY = "bloom-machine";
  const STATE = { sealed: ["Sealed", "✓"], open: ["Open", "○"], missing: ["Missing", "✕"] };
  const STATE_NOTE = { sealed: "", open: " (still collecting)", missing: " (no manifest)" };
  let lastOk = 0, failures = 0, summary = null, alerts = [], current = null;
  const expanded = new Set();

  const el = (tag, props, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) { if (k === "text") n.textContent = v; else n.setAttribute(k, v); }
    for (const kid of kids) n.append(kid);
    return n;
  };
  const ago = s => s < 90 ? `${Math.max(0, Math.round(s))} seconds` : s < 5400 ? `${Math.round(s / 60)} minutes`
                  : s < 172800 ? `${Math.round(s / 3600)} hours` : `${Math.round(s / 86400)} days`;
  const bytes = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  function alertText(a) {
    const who = a.machine_id;
    if (a.alert === "machine-silent") return `${who} has sent nothing for ${ago(a.age_s)}.`;
    if (a.alert === "ring-snapshot-stale") return a.age_s == null ? `${who} has never sent a ring snapshot.`
      : `${who}'s last ring snapshot is ${ago(a.age_s)} old. Run the archive before the ring rolls off.`;
    return `${who}: ${a.alert}`;
  }

  function hashCell(m, d) {
    const td = el("td", { class: "hashcell", "data-label": "Chain hash" });
    if (!d.chain_hash) { td.append(el("span", { class: "none", text: d.state === "open" ? "Not sealed yet" : "None" })); return td; }
    const key = `${m.id}/${d.day}`, open = expanded.has(key);
    const b = el("button", { type: "button", class: "hash-toggle", "aria-expanded": String(open),
                             "aria-label": `Chain hash for ${d.day}, press to ${open ? "shorten" : "show all"}` });
    b.textContent = open ? d.chain_hash : `${d.chain_hash.slice(0, 12)}…`;
    b.addEventListener("click", () => { if (open) expanded.delete(key); else expanded.add(key); renderRows(); });
    td.append(b);
    return td;
  }

  function renderRows() {
    const body = document.getElementById("day-rows");
    const m = summary.machines.find(x => x.id === current);
    if (!m) { body.replaceChildren(); return; }
    body.replaceChildren(...m.days.slice().reverse().map(d => {
      const [word, mark] = STATE[d.state] || [d.state, "?"];
      return el("tr", { "data-state": d.state },
        el("th", { scope: "row", text: d.day }),
        el("td", { class: "st", "data-label": "Status" }, el("span", { class: "mark", "aria-hidden": "true", text: mark }),
          document.createTextNode(word + (STATE_NOTE[d.state] || ""))),
        el("td", { class: "num", "data-label": "Records", text: String(d.files) }),
        el("td", { class: "num", "data-label": "Size", text: bytes(d.bytes) }),
        hashCell(m, d));
    }));
  }

  function renderSummary() {
    const box = document.getElementById("machine-summary");
    const m = summary.machines.find(x => x.id === current);
    if (!m) { box.replaceChildren(); return; }
    const sealed = m.days.filter(d => d.state === "sealed").length;
    const kinds = Object.entries(m.objects).map(([k, n]) => `${n} ${k}`).join(", ");
    box.replaceChildren(
      el("p", { class: "meta", text: `Last heard ${ago(summary.generated_at - m.last_seen)} ago · ${plural(sealed, "day", "days")} sealed` }),
      el("p", { class: "meta", text: kinds ? `Received: ${kinds}.` : "" }));
  }

  function renderPicker() {
    const sel = document.getElementById("machine-select"), ids = summary.machines.map(m => m.id);
    let saved = null;
    try { saved = sessionStorage.getItem(KEY); } catch (e) { saved = null; }
    if (!ids.includes(current)) current = ids.includes(saved) ? saved : ids[0] || null;
    sel.replaceChildren(...ids.map(id => el("option", { value: id, text: id })));
    if (current) sel.value = current;
    document.getElementById("empty").hidden = ids.length > 0;
  }

  function onPick() {
    current = document.getElementById("machine-select").value;
    try { sessionStorage.setItem(KEY, current); } catch (e) { /* private mode: the choice just isn't remembered */ }
    renderSummary(); renderRows();
  }
  document.getElementById("machine-select").addEventListener("change", onPick);

  function render() {
    const ms = summary.machines;
    const sealed = ms.reduce((n, m) => n + m.days.filter(d => d.state === "sealed").length, 0);
    const missing = ms.reduce((n, m) => n + m.days.filter(d => d.state === "missing").length, 0);
    document.getElementById("status").textContent = !ms.length ? "No machine has sent records yet."
      : `${plural(ms.length, "machine", "machines")} reporting. ${sealed} days sealed`
        + (missing ? `, ${missing} missing a manifest` : "") + ".";
    const ul = document.getElementById("alerts");
    ul.replaceChildren(...(alerts.length ? alerts.map(a => el("li", { text: alertText(a) }))
                                         : [el("li", { text: "No open alerts.", style: "border-left-color:var(--sealed)" })]));
    renderPicker(); renderSummary(); renderRows();
  }

  function tick() {
    const u = document.getElementById("updated"), banner = document.getElementById("banner");
    u.textContent = lastOk ? `Updated ${ago((Date.now() - lastOk) / 1000)} ago` : "";
    if (failures) {
      banner.hidden = false;
      banner.textContent = lastOk ? `Can't reach the ledger. Showing data from ${new Date(lastOk).toLocaleTimeString()}; retrying every minute.`
                                  : "Can't reach the ledger. Check that the bloom-ledger container is running on Unraid.";
    } else banner.hidden = true;
  }

  async function load() {
    try {
      const [s, a] = await Promise.all([fetch("/v1/summary", { cache: "no-store" }), fetch("/v1/alerts", { cache: "no-store" })]);
      if (!s.ok || !a.ok) throw new Error(`HTTP ${s.status}/${a.status}`);
      summary = await s.json(); alerts = await a.json();
      lastOk = Date.now(); failures = 0;   // a good response always clears the error banner
      render();
    } catch (e) {
      failures += 1;
    } finally {
      tick();
      setTimeout(load, REFRESH_MS);        // reschedule no matter what happened
    }
  }
  setInterval(tick, 15000);
  load();
})();
</script>
</body>
</html>
