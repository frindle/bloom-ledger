# bloom-ledger with Docker Compose.
#   cp .env.example .env     (optional: every setting has a safe default)
#   docker compose up -d --build
#   open http://<this machine>:8787/setup
# Data (objects, ledger manifests, index.sqlite) lives in the named volume "bloom-data". Back it up (see README).
# Installs made with ./update.sh have host folders named in .env (BLOOM_DATA_DIR, BLOOM_KEYS_DIR, BLOOM_SECRETS_DIR,
# BLOOM_EARNINGS_DIR, BLOOM_UID, BLOOM_GID). When those are set they are used instead of the named volumes, so an update
# never starts on an empty volume. Leave them unset on a new install.
# Older plain-compose installs kept data in ./data with no .env. Those would now start on an empty volume, so the
# container looks at ./data (the project folder is mounted read-only at /legacy) and refuses to start, with a message that
# says which .env lines keep the data, when it finds a ledger there and the volume is empty.
services:
  bloom-ledger:
    build: .
    image: bloom-ledger:latest
    container_name: bloom-ledger
    restart: unless-stopped
    user: "${BLOOM_UID:-99}:${BLOOM_GID:-100}"
    ports:
      - "${BLOOM_PORT:-8787}:8787"
    environment:
      BLOOM_LEDGER_LAN_URL: ${BLOOM_LEDGER_LAN_URL:-}
      BLOOM_TIMEZONE: ${BLOOM_TIMEZONE:-}
      BLOOM_AUTH: ${BLOOM_AUTH:-}
      BLOOM_ENABLE_EXPORT_API: ${BLOOM_ENABLE_EXPORT_API:-}
      BLOOM_BLOOMGAUGE: ${BLOOM_BLOOMGAUGE:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      DAILY_PUSH_HOUR: ${DAILY_PUSH_HOUR:-9}   # an hour of the UTC day
      BLOOM_ACCESS_TEAM_DOMAIN: ${BLOOM_ACCESS_TEAM_DOMAIN:-}
      BLOOM_ACCESS_AUD: ${BLOOM_ACCESS_AUD:-}
      BLOOM_KEYS: /keys
      BLOOM_LEGACY_DIR: /legacy
      BLOOM_TOKENS: /run/secrets/bloom_tokens
    volumes:
      - ${BLOOM_DATA_DIR:-bloom-data}:/data
      - ${BLOOM_KEYS_DIR:-bloom-keys}:/keys
      - ${BLOOM_SECRETS_DIR:-bloom-secrets}:/run/secrets:ro
      - .:/legacy:ro

  # Optional: run the Darkbloom earnings archiver here instead of on a Mac. Needs a Darkbloom token file.
  #   docker compose --profile earnings up -d
  # Only one earnings poller per Darkbloom account.
  bloom-earnings:
    profiles: ["earnings"]
    build: .
    image: bloom-ledger:latest
    container_name: bloom-earnings
    restart: unless-stopped
    command: ["/app/earnings-loop.sh"]
    user: "${BLOOM_UID:-99}:${BLOOM_GID:-100}"
    volumes:
      - ${BLOOM_EARNINGS_DIR:-bloom-earnings}:/state
      - ${BLOOM_SECRETS_DIR:-bloom-secrets}:/run/secrets:ro

volumes:
  bloom-data:
  bloom-keys:
  bloom-secrets:
  bloom-earnings:
