# bloom-ledger with Docker Compose.
#   cp .env.example .env     (optional: every setting has a safe default)
#   docker compose up -d --build
#   open http://<this machine>:8787/setup
# Data (objects, ledger manifests, index.sqlite) lives in the named volume "bloom-data". Back it up (see README).
services:
  bloom-ledger:
    build: .
    image: bloom-ledger:latest
    container_name: bloom-ledger
    restart: unless-stopped
    ports:
      - "${BLOOM_PORT:-8787}:8787"
    environment:
      BLOOM_LEDGER_LAN_URL: ${BLOOM_LEDGER_LAN_URL:-}
      BLOOM_TIMEZONE: ${BLOOM_TIMEZONE:-}
      BLOOM_AUTH: ${BLOOM_AUTH:-}
      BLOOM_ENABLE_EXPORT_API: ${BLOOM_ENABLE_EXPORT_API:-}
      BLOOM_BLOOMGAUGE: ${BLOOM_BLOOMGAUGE:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      DAILY_PUSH_HOUR: ${DAILY_PUSH_HOUR:-9}
      BLOOM_ACCESS_TEAM_DOMAIN: ${BLOOM_ACCESS_TEAM_DOMAIN:-}
      BLOOM_ACCESS_AUD: ${BLOOM_ACCESS_AUD:-}
    volumes:
      - bloom-data:/data

  # Optional: run the Darkbloom earnings archiver here instead of on a Mac. Needs a Darkbloom token file.
  #   docker compose --profile earnings up -d
  # Only one earnings poller per Darkbloom account.
  bloom-earnings:
    profiles: ["earnings"]
    build: .
    image: bloom-ledger:latest
    container_name: bloom-earnings
    restart: unless-stopped
    command: ["/app/earnings-loop.sh"]
    volumes:
      - bloom-earnings:/state
      - ${BLOOM_SECRETS_DIR:-./secrets}:/run/secrets:ro

volumes:
  bloom-data:
  bloom-earnings:
