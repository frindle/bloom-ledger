name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest playwright && playwright install --with-deps chromium
      - run: PYTHONPATH=lib python -m pytest ingest -q
      - run: sudo apt-get install -y shellcheck && shellcheck -S warning client/install.sh deploy/mac/*.sh
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: compose smoke
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8787/setup >/dev/null
          docker compose exec -T bloom-ledger python3 /app/server.py doctor
          docker compose down -v
