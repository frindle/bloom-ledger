name: ci
on:
  push:
  pull_request:
# A newer push to the same branch cancels the older run, so stale runs don't hold the macOS runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest playwright && playwright install --with-deps chromium
      - run: PYTHONPATH=lib python -m pytest ingest -q
      - run: PYTHONPATH=lib python -m pytest lib -q
      - run: bash tests/update_sh_test.sh
      - run: sudo apt-get install -y shellcheck && shellcheck -S warning client/install.sh deploy/mac/*.sh update.sh tests/e2e/*.sh
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: compose smoke
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8787/setup >/dev/null
          docker compose exec -T bloom-ledger python3 /app/server.py doctor
          docker compose down -v

  browser:
    name: browser new-user path (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: start the compose stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 2; done
      - name: walk the new-user path in a browser
        run: |
          python tests/e2e/browser_newuser.py http://127.0.0.1:8787 shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: shots
      - if: failure()
        run: docker compose logs --tail 80 bloom-ledger
      - if: always()
        run: docker compose down -v

  upgrade:
    name: upgrade keeps data (old update.sh install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main || true
      - run: bash tests/e2e/upgrade_test.sh
      - run: bash tests/e2e/upgrade_plain_compose_test.sh

  mac:
    name: mac install, pair, doctor, uninstall
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/e2e/mac_path.sh
